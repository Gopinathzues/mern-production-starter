version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mern_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: mern_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/starter_db
      - JWT_SECRET=your_jwt_secret_key_here
    depends_on:
      - mongo

  client:
    build: ./client
    container_name: mern_client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo-data: